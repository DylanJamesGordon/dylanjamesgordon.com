<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dylan James Gordon — Game Designer</title>
    <meta name="description" content="Game designer and developer. New site in progress.">
    <link rel="canonical" href="https://dylanjamesgordon.com/">

    <!-- Link previews (LinkedIn, Discord, iMessage, X, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dylanjamesgordon.com/">
    <meta property="og:title" content="Dylan James Gordon — Game Designer">
    <meta property="og:description" content="Game designer and developer.">
    <meta property="og:image" content="https://dylanjamesgordon.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Dylan James Gordon, Game Designer">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        @font-face {
            font-family: "Geist";
            font-weight: 100 900;
            font-display: swap;
            src: url("fonts/geist.woff2") format("woff2");
        }

        :root {
            color-scheme: dark;
            --ink: #eef5f6;
            --ink-dim: #9fb3b6;
            --hairline: rgb(238 243 246 / 22%);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: #101619;
            color: var(--ink);
            font-family: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .role {
            margin: 0.5rem 0 0;
            color: var(--ink-dim);
            font-size: 1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status {
            margin: 2.5rem 0 0;
            color: var(--ink-dim);
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        nav a {
            padding: 0.6rem 1.1rem;
            border: 1px solid var(--hairline);
            border-radius: 999px;
            color: var(--ink);
            text-decoration: none;
            transition: background-color 0.15s;
        }

        nav a:hover,
        nav a:focus-visible {
            background: rgb(238 243 246 / 10%);
        }
    </style>
</head>

<body>
    <main>
        <h1>Dylan James Gordon</h1>
        <p class="role">Game Designer</p>
        <p class="status">New site in progress.</p>
        <nav aria-label="Links">
            <a href="resume.pdf">Resume</a>
            <a href="https://www.linkedin.com/in/dylanjamesgordon/">LinkedIn</a>
            <a href="mailto:dylanjamesgordon15@gmail.com">Email</a>
        </nav>
    </main>
</body>

</html>
