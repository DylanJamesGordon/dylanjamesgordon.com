<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dylan James Gordon — Game Designer</title>
    <meta name="description" content="Game designer and developer. Systems, level design, and interactive work.">
    <!-- Fetched alongside the stylesheet instead of after it, so the font
         is usually in hand before first paint. -->
    <link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Atmospheric backdrop. Purely decorative, so it's hidden from assistive tech. -->
    <div class="backdrop" aria-hidden="true">
        <div class="backdrop__scrim"></div>
    </div>

    <header class="chrome">
        <div class="chrome__group chrome__group--identity">
            <span class="tab">Dylan James Gordon</span>
            <span class="tab">Game Designer</span>
        </div>

        <!-- Mirrors the focused card so the carousel reads as part of the UI, not a separate widget. -->
        <div class="chrome__group chrome__group--center">
            <output class="tab" id="focus-label" for="track">Rap Wizards</output>
        </div>

        <nav class="chrome__group chrome__group--links" aria-label="Links">
            <a class="tab" href="resume.pdf" data-viewer="resume-viewer">Resume</a>
            <a class="tab" href="https://www.linkedin.com/in/dylanjamesgordon/">LinkedIn</a>
            <a class="tab" href="mailto:dylanjamesgordon15@gmail.com">Email</a>
        </nav>
    </header>

    <main>
        <h1 class="visually-hidden">Dylan James Gordon, game designer</h1>

        <!-- Project rail. The track slides so the selected card sits centred;
             JS publishes each card's distance from centre and CSS scales on it. -->
        <div class="gallery">
            <ul class="gallery__track" id="track" aria-label="Projects">
                <li class="card" data-title="This Website">
                    <button class="card__face" type="button">
                        <span class="card__art" data-art="1"></span>
                        <span class="card__meta">
                            <span class="card__title">This Website</span>
                            <span class="card__tag">Designer &amp; Developer</span>
                            <span class="card__engine">HTML · CSS · JavaScript</span>
                        </span>
                    </button>
                </li>

                <li class="card" data-title="Rap Wizards">
                    <button class="card__face" type="button">
                        <span class="card__art" data-art="2"></span>
                        <span class="card__meta">
                            <span class="card__title">Rap Wizards</span>
                            <span class="card__tag">Solo Developer</span>
                            <span class="card__engine">Unreal Engine</span>
                        </span>
                    </button>
                </li>

                <li class="card" data-title="Studio Pending">
                    <button class="card__face" type="button">
                        <span class="card__art" data-art="3"></span>
                        <span class="card__meta">
                            <span class="card__title">Studio Pending</span>
                            <span class="card__tag">Technical Director</span>
                            <span class="card__engine">Unreal Engine</span>
                        </span>
                    </button>
                </li>
            </ul>
        </div>
    </main>

    <!-- In-page resume. The frame has no src until first opened, so the PDF
         costs nothing on initial load. -->
    <dialog class="viewer" id="resume-viewer" aria-label="Resume">
        <div class="viewer__bar">
            <span class="tab">Resume</span>
            <a class="tab" href="resume.pdf" download="Dylan James Gordon Resume.pdf">Download</a>
            <button class="tab" type="button" data-close>Close</button>
        </div>
        <iframe class="viewer__frame" title="Resume" data-src="resume.pdf#toolbar=0&amp;navpanes=0&amp;view=FitH"></iframe>
    </dialog>

    <script src="gallery.js" type="module"></script>
    <script src="viewer.js" type="module"></script>
</body>

</html>
