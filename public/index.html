<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dylan James Gordon</title>

    <style>
        /* ---- Design tokens -------------------------------------------------
           The aesthetic lives here. Changing these values restyles the whole
           page, so the visual direction can be swapped without touching markup. */
        :root {
            --bg: #0b0b0c;
            --fg: #e8e8ea;
            --muted: #8a8a93;
            --accent: #e8e8ea;

            --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

            --step-0: 1rem;
            --step-1: 1.25rem;
            --step-2: clamp(2rem, 6vw, 3.5rem);

            --measure: 65ch;
            --gutter: clamp(1.25rem, 5vw, 3rem);
        }

        /* ---- Base ---------------------------------------------------------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font);
            font-size: var(--step-0);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ---- Layout -------------------------------------------------------- */
        .shell {
            max-width: var(--measure);
            margin-inline: auto;
            padding: var(--gutter);
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1rem;
        }

        /* ---- Type ---------------------------------------------------------- */
        h1 {
            margin: 0;
            font-size: var(--step-2);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .tagline {
            margin: 0;
            font-size: var(--step-1);
            color: var(--muted);
        }

        /* ---- Links --------------------------------------------------------- */
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 1rem;
            padding: 0;
            list-style: none;
        }

        a {
            color: var(--accent);
            text-decoration-color: var(--muted);
            text-underline-offset: 0.25em;
        }

        a:hover {
            text-decoration-color: currentColor;
        }

        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <main class="shell">
        <h1>Dylan James Gordon</h1>
        <p class="tagline">Game developer. Portfolio in progress.</p>

        <ul class="links">
            <li><a href="https://www.linkedin.com/in/dylanjamesgordon/">LinkedIn</a></li>
            <li><a href="mailto:dylanjamesgordon15@gmail.com">Email</a></li>
        </ul>
    </main>
</body>

</html>
