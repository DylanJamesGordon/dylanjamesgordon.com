<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dylan James Gordon — Game Developer</title>
    <meta name="description" content="Game developer and designer. Systems, level design, and interactive work.">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Atmospheric backdrop. Purely decorative, so it's hidden from assistive tech. -->
    <div class="backdrop" aria-hidden="true">
        <!-- Two ridges at different depths; the far one is hazier, which is what
             sells the distance. -->
        <svg class="backdrop__ridge backdrop__ridge--far" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path d="M0,320 L0,272 L180,238 L330,264 L470,206 L620,248 L760,188
                     L900,240 L1060,200 L1230,252 L1440,224 L1440,320 Z" />
        </svg>

        <svg class="backdrop__ridge backdrop__ridge--near" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path d="M0,320 L0,298 L220,272 L430,216 L560,160 L660,100 L720,68
                     L790,118 L880,180 L1010,232 L1210,280 L1440,300 L1440,320 Z" />
        </svg>

        <div class="backdrop__haze"></div>
    </div>

    <header class="chrome">
        <div class="chrome__group">
            <span class="pill">Dylan James Gordon</span>
            <span class="pill pill--muted">Game Developer</span>
        </div>

        <!-- Mirrors the focused card so the carousel reads as part of the UI, not a separate widget. -->
        <div class="chrome__group chrome__group--center">
            <output class="pill" id="focus-label" for="gallery">Heavy Metal</output>
        </div>

        <nav class="chrome__group" aria-label="Links">
            <a class="pill" href="resume.pdf">Resume</a>
            <a class="pill" href="https://www.linkedin.com/in/dylanjamesgordon/">LinkedIn</a>
            <a class="pill" href="mailto:dylanjamesgordon15@gmail.com">Email</a>
        </nav>
    </header>

    <main>
        <h1 class="visually-hidden">Dylan James Gordon, game developer</h1>

        <!-- Arc gallery. JS assigns each card an offset from center; CSS derives the transform. -->
        <ul class="gallery" id="gallery" aria-label="Projects">
            <li class="card" data-title="Heavy Metal">
                <button class="card__face" type="button">
                    <span class="card__art" data-art="1"></span>
                    <span class="card__meta">
                        <span class="card__title">Heavy Metal</span>
                        <span class="card__tag">Unreal · Systems &amp; Level Design</span>
                    </span>
                </button>
            </li>

            <li class="card" data-title="Realm Sim">
                <button class="card__face" type="button">
                    <span class="card__art" data-art="2"></span>
                    <span class="card__meta">
                        <span class="card__title">Realm Sim</span>
                        <span class="card__tag">Unity · Interactive Comic</span>
                    </span>
                </button>
            </li>

            <li class="card" data-title="Untitled">
                <button class="card__face" type="button">
                    <span class="card__art" data-art="3"></span>
                    <span class="card__meta">
                        <span class="card__title">Untitled</span>
                        <span class="card__tag">In development</span>
                    </span>
                </button>
            </li>
        </ul>
    </main>

    <script src="gallery.js" type="module"></script>
</body>

</html>
